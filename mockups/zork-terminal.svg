<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <!-- Mockup: Zork I running in the arcade cabinet terminal -->
  <rect width="1000" height="720" fill="#000000"/>

  <g font-family="Consolas, 'Lucida Console', monospace">
    <!-- Back button -->
    <rect x="30" y="24" width="90" height="34" fill="#333333"/>
    <text x="75" y="46" font-size="14" fill="#0c0" text-anchor="middle">Back</text>

    <!-- Cabinet marquee -->
    <text x="500" y="47" font-size="18" fill="#0f0" text-anchor="middle" font-weight="bold">*** ZORK I: THE GREAT UNDERGROUND EMPIRE ***</text>

    <!-- Terminal frame -->
    <rect x="140" y="80" width="720" height="560" fill="#000000" stroke="#0c0" stroke-width="1"/>

    <!-- Status line (Z-machine grid window, inverse video) -->
    <rect x="141" y="81" width="718" height="26" fill="#0c0"/>
    <text x="156" y="99" font-size="14" fill="#000000">West of House</text>
    <text x="700" y="99" font-size="14" fill="#000000">Score: 0    Moves: 2</text>

    <!-- Buffer window (scrolling story text) -->
    <g font-size="14" fill="#0c0">
      <text x="156" y="138">ZORK I: The Great Underground Empire</text>
      <text x="156" y="158">Copyright (c) 1981, 1982, 1983 Infocom, Inc. All rights reserved.</text>
      <text x="156" y="178">ZORK is a registered trademark of Infocom, Inc.</text>
      <text x="156" y="198">Revision 88 / Serial number 840726</text>

      <text x="156" y="238" font-weight="bold">West of House</text>
      <text x="156" y="258">You are standing in an open field west of a white house, with a</text>
      <text x="156" y="278">boarded front door.</text>
      <text x="156" y="298">There is a small mailbox here.</text>

      <text x="156" y="338">&#62;open mailbox</text>
      <text x="156" y="358">Opening the small mailbox reveals a leaflet.</text>

      <text x="156" y="398">&#62;read leaflet</text>
      <text x="156" y="418">(Taken)</text>
      <text x="156" y="438">"WELCOME TO ZORK!</text>
      <text x="156" y="478">ZORK is a game of adventure, danger, and low cunning. In it you</text>
      <text x="156" y="498">will explore some of the most amazing territory ever seen by</text>
      <text x="156" y="518">mortals. No computer should be without one!"</text>

      <!-- Input line with cursor -->
      <text x="156" y="578">&#62;</text>
      <rect x="170" y="565" width="9" height="16" fill="#0c0">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Footer hint -->
    <text x="156" y="668" font-size="12" fill="#666666">Type 'save' to save your progress. Type 'quit' to return to the arcade.</text>
  </g>

  <!-- Annotations -->
  <g font-family="Consolas, 'Lucida Console', monospace" font-size="12" fill="#c60">
    <text x="870" y="95">&#8592; status line: Z-machine</text>
    <text x="870" y="111">  grid window (room,</text>
    <text x="870" y="127">  score, moves)</text>
    <text x="870" y="300">&#8592; scrolling buffer</text>
    <text x="870" y="316">  window, colors from</text>
    <text x="870" y="332">  Settings.theme</text>
    <text x="870" y="575">&#8592; inline input, blinking</text>
    <text x="870" y="591">  cursor; keys captured</text>
    <text x="870" y="607">  so hotkeys don't fire</text>
  </g>
</svg>
